<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comptoir – boissons, commandes et stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EDF0EC; --surface:#FFFFFF; --surface-2:#F5F7F4; --ink:#17262B; --ink-2:#526468; --line:#D6DDD8;
  --brand:#1E5B4B; --brand-ink:#FFFFFF; --brand-soft:#DCEBE4;
  --drink:#2B6CA3; --drink-soft:#DDE9F4; --food:#B0670F; --food-soft:#F6E8D2;
  --danger:#B8382A; --danger-soft:#F7DEDA; --warn:#8F6500; --warn-soft:#F8ECC8; --ok:#2C7A4D; --ok-soft:#DCEFE3;
  --slate:#153F34; --slate-ink:#E9F2EC; --slate-dim:#9BBFB1;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-display:'Young Serif',Georgia,'Times New Roman',serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1A1D; --surface:#162327; --surface-2:#1C2C31; --ink:#E7EFEB; --ink-2:#9DB1B0; --line:#2A3E43;
    --brand:#5CC2A1; --brand-ink:#07211A; --brand-soft:#1B3B33;
    --drink:#72B3E8; --drink-soft:#1B3246; --food:#E5A650; --food-soft:#3A2B15;
    --danger:#F27E70; --danger-soft:#40201C; --warn:#E8C45A; --warn-soft:#3A3314; --ok:#66C68C; --ok-soft:#1A3A29;
    --slate:#1B3F36; --slate-ink:#E9F2EC; --slate-dim:#8FB5A7;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1A1D; --surface:#162327; --surface-2:#1C2C31; --ink:#E7EFEB; --ink-2:#9DB1B0; --line:#2A3E43;
  --brand:#5CC2A1; --brand-ink:#07211A; --brand-soft:#1B3B33;
  --drink:#72B3E8; --drink-soft:#1B3246; --food:#E5A650; --food-soft:#3A2B15;
  --danger:#F27E70; --danger-soft:#40201C; --warn:#E8C45A; --warn-soft:#3A3314; --ok:#66C68C; --ok-soft:#1A3A29;
  --slate:#1B3F36; --slate-ink:#E9F2EC; --slate-dim:#8FB5A7;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:22px 14px 16px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);font-family:var(--font-display);font-size:20px}
.bname{font-family:var(--font-display);font-size:22px}
.estab{padding:6px 8px 18px;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:var(--r-md);background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;text-align:center}
.badge.warn{background:var(--danger);color:#fff}
.side-foot{margin-top:auto;padding:14px 8px 0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.db{background:var(--ok)}
.main{padding:28px clamp(16px,3vw,40px) 64px;min-width:0;max-width:1400px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar:empty{display:none!important;border:0}
.tab-i{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border:0;background:none;color:var(--ink-2);font-size:10.5px;font-weight:500;cursor:pointer;position:relative}
.tab-i.on{color:var(--brand);font-weight:700}
.tab-i .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;font-size:10.5px;padding:0 5px}
@media (max-width:899px){
  .app{display:block}
  .side{display:none}
  .tabbar{display:flex}
  .main{padding:18px 14px 120px}
  h1{font-size:24px}
}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.vh .sub{margin-top:4px;color:var(--ink-2)}
.vh-actions{display:flex;flex-wrap:wrap;gap:8px}
.roletag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.roletag .ic{width:14px;height:14px}
.roletag.on{background:var(--brand-soft);color:var(--brand)}
.side-foot-actions{padding:2px 8px 0}
.topbar{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
@media (max-width:899px){.topbar{display:flex}}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand);border-color:var(--brand);filter:brightness(1.1)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-sm);border:1px solid transparent;background:none;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.in,.sel,.ta{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);}
.in:focus,.sel:focus,.ta:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.ta{resize:vertical;min-height:64px}
.searchbox{position:relative;flex:1;min-width:180px;max-width:420px}
.searchbox .ic{position:absolute;left:11px;top:10px;color:var(--ink-2);width:18px;height:18px}
.searchbox .in{padding-left:36px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld-l{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld-h{font-size:12.5px;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.row2,.row3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card h2,.card h3{margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2,.card-h h3{margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.tile-thumb{display:block;width:100%;height:64px;border-radius:8px;background-size:cover;background-position:center;background-color:var(--surface-2);margin-bottom:6px}
.thumb-sm{display:block;width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.thumb-empty{border:1px dashed var(--line)}
.imgpick{display:flex;align-items:center;gap:12px}
.imgpick-preview{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none}
.imgpick-empty{display:grid;place-items:center;color:var(--ink-2);border:1px dashed var(--line)}
.imgpick-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.brand-logo{width:34px;height:34px;border-radius:9px;object-fit:contain;background:var(--surface-2);flex:none}
.tp-logo{display:block;max-width:75%;max-height:64px;margin:0 auto 6px}
.estab-row{display:flex;align-items:center;gap:8px;padding:6px 8px 18px}
.estab-row .estab{padding:0}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.room-card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.room-card.paid{background:var(--ok-soft);border-color:transparent}
.room-row{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;margin-bottom:8px}
.agenda-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.agenda-month{text-transform:capitalize;min-width:140px;text-align:center}
.agenda-wrap{overflow-x:auto}
.agenda-tbl{border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.agenda-tbl th,.agenda-tbl td{border:1px solid var(--line);text-align:center;padding:0;height:30px;width:26px;min-width:26px}
.agenda-name{text-align:left!important;padding:4px 10px!important;min-width:150px;width:150px;position:sticky;left:0;background:var(--surface);z-index:1}
.agenda-day.we,.agenda-cell.we{background:var(--surface-2)}
.agenda-day.today,.agenda-cell.today{box-shadow:inset 0 0 0 2px var(--brand)}
.agenda-cell{cursor:pointer}
.agenda-cell:hover{background:var(--surface-2)}
.agenda-cell.occ{background:var(--brand-soft);cursor:pointer}
.agenda-cell.occ:hover{filter:brightness(0.95)}
.agenda-label{display:block;font-size:9px;font-weight:700;color:var(--brand);white-space:nowrap;overflow:hidden;padding:0 1px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 24px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.login-card.wide{max-width:560px}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.user-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer;text-align:center}
.user-card:hover{border-color:var(--brand);background:var(--surface-2)}
.user-card .ic{width:28px;height:28px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--danger-soft);color:var(--danger)}
.pill.boisson{background:var(--drink-soft);color:var(--drink)}
.pill.plat{background:var(--food-soft);color:var(--food)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.empty{padding:26px 12px;text-align:center;color:var(--ink-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl th.num{text-align:right}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .acts{display:flex;justify-content:flex-end;gap:2px;white-space:nowrap}
.ellip{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.li:last-child{border-bottom:0}
button.li{cursor:pointer}
button.li:hover{background:var(--surface-2)}
.li b{font-weight:600}

/* ---------- Tableau de bord ---------- */
.slate{background:var(--slate);color:var(--slate-ink);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:16px}
.slate h1{font-size:30px}
.slate h1::first-letter{text-transform:uppercase}
.slate .sub{color:var(--slate-dim);margin-top:4px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:20px;border-top:1px solid rgba(233,242,236,.22)}
.fig{padding:16px 16px 2px 0}
.fig+.fig{padding-left:18px;border-left:1px solid rgba(233,242,236,.22)}
.fig-l{font-size:13px;color:var(--slate-dim)}
.fig-v{font-family:var(--font-display);font-size:30px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .figs{grid-template-columns:1fr 1fr}
  .fig:nth-child(3){padding-left:0;border-left:0}
  .fig:nth-child(n+3){border-top:1px solid rgba(233,242,236,.22);margin-top:14px}
  .fig-v{font-size:24px}
}
.hours{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:6px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.hbw{flex:1;display:flex;align-items:flex-end;width:100%;min-height:0}
.hbar{width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.hbar.zero{background:var(--line)}
.hlab{font-size:11px;color:var(--ink-2);margin-top:4px}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:6px 0 10px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* ---------- Prise de commande ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:14px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:92px;padding:12px 12px 11px 17px;text-align:left;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.tile.boisson::before{background:var(--drink)}
.tile.plat::before{background:var(--food)}
.tile:hover{border-color:var(--ink-2)}
.tile:active{background:var(--surface-2)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile-name{font-weight:600;line-height:1.25}
.tile-meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px}
.tile-price{font-weight:600;font-variant-numeric:tabular-nums}
.tile-stock{color:var(--ink-2);font-size:12px}
.tile-stock.warn{color:var(--warn);font-weight:600}
.tile-stock.out{color:var(--danger);font-weight:600}
.tile-qty{position:absolute;right:8px;top:8px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.ticket{position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.t-head{padding:16px 16px 4px}
.t-head-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.t-body{overflow:auto;flex:1;min-height:90px;padding:0 16px}
.t-line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.t-line:last-child{border-bottom:0}
.t-name{font-weight:600}
.t-tot{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.t-foot{padding:14px 16px 16px;border-top:1px solid var(--line)}
.t-total{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 12px}
.t-total strong{font-family:var(--font-display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.t-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ticketbar{display:none}
@media (max-width:899px){
  .pos{grid-template-columns:1fr}
  .ticket{display:none;position:fixed;inset:0;z-index:40;max-height:none;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .pos.open .ticket{display:flex}
  .ticketbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19}
  .ticketbar .btn{width:100%;min-height:48px;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.25)}
}

/* ---------- Suivi ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start;scroll-snap-type:x proximity}
.kcol{scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;min-height:160px}
.kcol-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-weight:600}
.kcol-h span:last-child{color:var(--ink-2);font-weight:500}
.kcol-b{display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:var(--r-md)}
.ocard.late{border-top-color:var(--warn)}
.ocard.vlate{border-top-color:var(--danger)}
.oc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.oc-h b{font-weight:700}
.oc-l{display:flex;flex-direction:column;gap:3px}
.oc-l div{display:flex;gap:8px;align-items:baseline}
.oc-l .q{font-weight:700;min-width:26px;font-variant-numeric:tabular-nums}
.oc-l i{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.oc-l i.boisson{background:var(--drink)}
.oc-l i.plat{background:var(--food)}
.oc-note{padding:6px 9px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:13px}
.oc-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.oc-f .grow{flex:1}

/* ---------- Carte & stock ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kpi-l{font-size:13px;color:var(--ink-2)}
.kpi-v{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.warn .kpi-v{color:var(--warn)}
.kpi.bad .kpi-v{color:var(--danger)}
.rec-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 44px 34px;gap:8px;align-items:center;margin-bottom:8px}
.calc{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);font-size:13.5px;margin:6px 0 4px}
.check{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--brand)}

/* ---------- Modales & retours ---------- */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(5vh + env(safe-area-inset-top,0px)) 14px 14px;overflow:auto;background:rgba(9,20,22,.55)}
.modal{width:min(580px,100%);background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal.wide{width:min(760px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.m-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}
.err{min-height:0;color:var(--danger);font-weight:600;font-size:13.5px}
.err:not(:empty){margin-top:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg-i{position:relative}
.seg-i input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg-i span{display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.seg-i input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg-i input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.pay-total{font-family:var(--font-display);font-size:38px;margin:2px 0 16px;font-variant-numeric:tabular-nums}
.change{margin:-4px 0 4px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;max-width:min(92vw,460px);padding:11px 18px;border-radius:var(--r-md);background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:899px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.tl{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.sum .t{font-weight:700;font-size:16px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.danger-zone{border-color:var(--danger)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.receipt-wrap{display:flex;justify-content:center;background:var(--surface-2);border-radius:var(--r-md);padding:16px 0;margin-bottom:4px;max-height:60vh;overflow:auto}
.ticket-print{font-family:'Courier New',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;width:100%;max-width:300px;margin:0 auto;font-size:13px;line-height:1.55;color:#111;background:#fff;padding:16px 18px;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.ticket-print.pw58{max-width:220px;font-size:12px}
.ticket-print .tp-c{text-align:center}
.ticket-print .tp-big{font-size:15px;font-weight:700}
.ticket-print .tp-row{display:flex;justify-content:space-between;gap:10px}
.ticket-print .tp-item{margin-bottom:3px}
.ticket-print .tp-sub{color:#555;font-size:11px}
.ticket-print hr{border:none;border-top:1px dashed #555;margin:8px 0}
@media print{
  body *{visibility:hidden!important}
  #modal-root, #modal-root *{visibility:visible!important}
  #modal-root{position:static!important}
  #modal-root .scrim{position:static!important;background:none!important;padding:0!important;display:block!important;inset:auto!important;overflow:visible!important;min-height:0!important}
  #modal-root .modal{box-shadow:none!important;border-radius:0!important;padding:0!important;width:auto!important;margin:0!important}
  #modal-root .m-head,#modal-root .m-foot,#modal-root .err{display:none!important}
  .receipt-wrap{background:none!important;padding:0!important;max-height:none!important;overflow:visible!important}
  .ticket-print{box-shadow:none!important;margin:0!important}
}
</style>

function stats(orders) {
  const r = {ttc: 0, ht: 0, tva: 0, cost: 0, items: 0, n: orders.length, byKind: {boisson: 0, plat: 0}, byPay: {}, top: []};
  const top = {};
  orders.forEach(o => {
    o.items.forEach(l => {
      const t = l.price * l.qty, h = t / (1 + (l.tva || 0) / 100);
      r.ttc += t; r.ht += h; r.tva += t - h; r.cost += (l.cost || 0) * l.qty; r.items += l.qty;
      r.byKind[l.kind] = (r.byKind[l.kind] || 0) + t;
      const k = top[l.name] = top[l.name] || {name: l.name, kind: l.kind, qty: 0, ca: 0};
      k.qty += l.qty; k.ca += t;
    });
    const pk = o.pay || 'autre'; r.byPay[pk] = (r.byPay[pk] || 0) + o.total;
  });
  r.avg = r.n ? r.ttc / r.n : 0; r.margin = r.ht - r.cost;
  r.top = Object.values(top).sort((a, b) => b.qty - a.qty);
  return r;
}

  halls.forEach(h => { byPay[h.pay] = round2((byPay[h.pay] || 0) + h.amount); });
  const grandTotal = round2(st.ttc + roomTotal + hallTotal);

function parseCsvText(text) {

  const firstLine = text.slice(0, text.indexOf('\n') > -1 ? text.indexOf('\n') : text.length);
  const delim = firstLine.split(';').length >= firstLine.split(',').length ? ';' : ',';
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {

    reader.onerror = () => reject(reader.error || new Error('lecture'));

      const img = new Image();

        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;

        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));

          const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);

          resolve(canvas.toDataURL(outType, outType === 'image/jpeg' ? quality : undefined));
        } catch (e) { reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    '<div class="t-actions"><button type="button" class="btn btn-primary" data-act="pos-send"' + (cnt ? '' : ' disabled') + '>Envoyer</button><button type="button" class="btn" data-act="pos-pay"' + (cnt ? '' : ' disabled') + '>Envoyer et encaisser</button></div>' +

function viewPos() {
  const u = S.ui, q = u.qpos.trim().toLowerCase();

  const cats = [...new Set(S.products.filter(inKind).map(p => p.cat).filter(Boolean))];
  const list = S.products.filter(p => inKind(p) && (!u.cat || p.cat === u.cat) && (!q || p.name.toLowerCase().includes(q) || (p.cat || '').toLowerCase().includes(q)));
  const inDraft = {}; S.draft.items.forEach(it => inDraft[it.pid] = it.qty);
  const tiles = list.map(p => {
    const n = portions(p), can = canAdd(p.id);
    const hint = n === Infinity ? '' : (n <= 0 ? '<span class="tile-stock out">Rupture</span>' : (n <= 5 ? '<span class="tile-stock warn">' + n + ' restant' + (n > 1 ? 's' : '') + '</span>' : ''));
    return '<button type="button" class="tile ' + p.kind + '" data-act="pos-add" data-id="' + p.id + '"' + (can ? '' : ' disabled') + '>' + (p.img ? '<span class="tile-thumb" style="background-image:url(&quot;' + p.img + '&quot;)"></span>' : '') + '<span class="tile-name">' + esc(p.name) + '</span><span class="tile-meta"><span class="tile-price">' + money(p.price) + '</span>' + hint + '</span>' + (inDraft[p.id] ? '<span class="tile-qty">' + inDraft[p.id] + '</span>' : '') + '</button>';
  }).join('');
  const cnt = draftCount();
  return vh('Prise de commande', 'Touchez les produits pour composer la commande. Le stock se met à jour à l\'envoi.') +
    '<div class="pos' + (u.ticketOpen ? ' open' : '') + '"><section>' +
    '<div class="toolbar"><div class="searchbox">' + ic('search') + '<input class="in" id="q-pos" type="search" placeholder="Rechercher un produit" aria-label="Rechercher un produit" data-bind="q-pos" value="' + esc(u.qpos) + '" autocomplete="off"></div>' +
    '<div class="chips">' + chip('pos-kind', 'tout', 'Tout', u.kind === 'tout') + chip('pos-kind', 'boisson', 'Boissons', u.kind === 'boisson') + chip('pos-kind', 'plat', 'Plats', u.kind === 'plat') + '</div></div>' +
    (cats.length > 1 ? '<div class="chips">' + chip('pos-cat', '', 'Toutes catégories', !u.cat) + cats.map(c => chip('pos-cat', c, c, u.cat === c)).join('') + '</div>' : '') +
    (tiles ? '<div class="tiles" data-scroll="tiles">' + tiles + '</div>' : '<p class="empty">Aucun produit ne correspond. Ajoutez des produits dans la Carte.</p>') + '</section>' +

    '<div class="ticketbar"><button type="button" class="btn btn-primary" data-act="pos-open">' + '<span>' + ic('cart') + ' Voir la commande (' + cnt + ')</span><span>' + money(draftTotal()) + '</span></button></div>';
}

/* ---------- Suivi ---------- */
function viewSuivi() {
  const f = S.ui.sf;
  const canCash = S.session.role !== 'cuisine';
  const cols = FLOW.map(st => ({st, orders: S.orders.filter(o => o.status === st).sort((a, b) => a.createdAt - b.createdAt)}));
  const titles = {nouvelle: 'Nouvelles', preparation: 'En préparation', prete: 'Prêtes', servie: 'Servies, à encaisser'};
  const card = o => {
    const lines = o.items.filter(l => f === 'tout' || l.kind === f);
    if (!lines.length) return '';
    const min = Math.floor((Date.now() - o.createdAt) / 60000), cls = (o.status === 'nouvelle' || o.status === 'preparation') ? (min > 40 ? ' vlate' : min > 20 ? ' late' : '') : '';
    return '<article class="ocard' + cls + '"><div class="oc-h"><span><b>N°' + o.n + '</b> · ' + esc(orderLabel(o)) + '</span><span class="muted small">' + ago(o.createdAt) + '</span></div>' +
      '<div class="oc-l">' + lines.map(l => '<div><span class="q">' + l.qty + '×</span><i class="' + l.kind + '"></i><span>' + esc(l.name) + '</span></div>').join('') + '</div>' +
      (o.note ? '<div class="oc-note">' + esc(o.note) + '</div>' : '') +
      '<div class="oc-f"><span class="grow tnum"><b>' + money(o.total) + '</b></span></div>' +
      '<div class="oc-f">' + (NEXT_LABEL[o.status] ? '<button type="button" class="btn btn-primary btn-sm grow" data-act="ord-next" data-id="' + o.id + '">' + NEXT_LABEL[o.status] + '</button>' : '') +
      (canCash ? '<button type="button" class="btn btn-sm' + (o.status === 'servie' ? ' btn-primary grow' : '') + '" data-act="ord-pay" data-id="' + o.id + '">Encaisser</button><button type="button" class="icon-btn danger" data-act="ord-cancel" data-id="' + o.id + '" aria-label="Annuler la commande ' + o.n + '">' + ic('x') + '</button>' : '') + '</div></article>';
  };
  const total = S.orders.filter(o => FLOW.includes(o.status)).length;
  return vh('Suivi des commandes', total ? total + ' commande' + (total > 1 ? 's' : '') + ' à traiter' : 'Toutes les commandes sont traitées',
      '<div class="chips" role="group" aria-label="Filtrer par poste">' + chip('suivi-f', 'tout', 'Tout', f === 'tout') + chip('suivi-f', 'boisson', 'Bar', f === 'boisson') + chip('suivi-f', 'plat', 'Cuisine', f === 'plat') + '</div>') +
    '<div class="kanban" data-scroll="kanban">' + cols.map(c => {
      const html = c.orders.map(card).join('');
      return '<section class="kcol" aria-label="' + titles[c.st] + '"><div class="kcol-h"><span>' + titles[c.st] + '</span><span>' + c.orders.length + '</span></div><div class="kcol-b">' + (html || '<p class="empty small">Rien ici.</p>') + '</div></section>';
    }).join('') + '</div>';
}

/* ---------- Carte ---------- */
function viewCarte() {
  const u = S.ui, q = u.qcarte.trim().toLowerCase();
  const list = S.products.filter(p => (u.kcarte === 'tout' || p.kind === u.kcarte) && (!q || p.name.toLowerCase().includes(q) || (p.cat || '').toLowerCase().includes(q)))
    .sort((a, b) => a.kind.localeCompare(b.kind) || (a.cat || '').localeCompare(b.cat || '') || a.name.localeCompare(b.name));
  const rows = list.map(p => {
    const c = productCost(p), ht = p.price / (1 + (p.tva || 0) / 100), mg = ht > 0 ? (ht - c) / ht * 100 : 0, n = portions(p);
    return '<tr><td>' + (p.img ? '<img class="thumb-sm" src="' + p.img + '" alt="">' : '<span class="thumb-sm thumb-empty"></span>') + '</td><td><b>' + esc(p.name) + '</b><br><span class="muted small">' + esc(p.cat || '—') + '</span></td><td><span class="pill ' + p.kind + '">' + (p.kind === 'boisson' ? 'Boisson' : 'Plat') + '</span></td>' +
      '<td class="num">' + money(p.price) + '<br><span class="muted small">TVA ' + qf(p.tva) + ' %</span></td><td class="num">' + (p.recipe.length ? money(c) : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + (p.recipe.length ? pct(mg) + ' %' : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + (n === Infinity ? '<span class="muted">Non suivi</span>' : (n <= 0 ? '<span class="pill out">Rupture</span>' : n)) + '</td>' +
      '<td><button type="button" class="chip' + (p.active ? ' on' : '') + '" data-act="prod-toggle" data-id="' + p.id + '" aria-pressed="' + p.active + '">' + (p.active ? 'Au menu' : 'Retiré') + '</button></td>' +
      '<td><div class="acts"><button type="button" class="icon-btn" data-act="prod-edit" data-id="' + p.id + '" aria-label="Modifier ' + esc(p.name) + '">' + ic('edit') + '</button><button type="button" class="icon-btn danger" data-act="prod-del" data-id="' + p.id + '" aria-label="Supprimer ' + esc(p.name) + '">' + ic('trash') + '</button></div></td></tr>';
  }).join('');
  return vh('Carte', S.products.length + ' produits · boissons et plats avec leur recette de stock', '<button type="button" class="btn btn-primary" data-act="prod-new">' + ic('plus') + 'Nouveau produit</button>') +
    '<div class="toolbar"><div class="searchbox">' + ic('search') + '<input class="in" id="q-carte" type="search" placeholder="Rechercher" aria-label="Rechercher dans la carte" data-bind="q-carte" value="' + esc(u.qcarte) + '" autocomplete="off"></div><div class="chips">' +
    chip('carte-k', 'tout', 'Tout', u.kcarte === 'tout') + chip('carte-k', 'boisson', 'Boissons', u.kcarte === 'boisson') + chip('carte-k', 'plat', 'Plats', u.kcarte === 'plat') + '</div></div>' +
    (rows ? '<div class="tablewrap"><table class="tbl"><thead><tr><th></th><th>Produit</th><th>Type</th><th class="num">Prix TTC</th><th class="num">Coût matière</th><th class="num">Marge</th><th class="num">Portions dispo</th><th>État</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="empty card">Aucun produit. Créez votre premier produit avec « Nouveau produit ».</p>') +
    '<p class="muted small" style="margin-top:10px">La marge est calculée hors taxes à partir du coût d\'achat des articles de la recette.</p>';
}

/* ---------- Stock ---------- */
function viewStock() {
  const u = S.ui, q = u.qstock.trim().toLowerCase();
  const val = S.stock.reduce((a, s) => a + s.qty * s.cost, 0), low = S.stock.filter(s => stockStatus(s) === 'low').length, out = S.stock.filter(s => stockStatus(s) === 'out').length;
  const cats = [...new Set(S.stock.map(s => s.cat).filter(Boolean))];

    .sort((a, b) => a.name.localeCompare(b.name));

      '<td class="num"><b>' + qf(s.qty) + '</b> ' + esc(s.unit) + '</td><td><span class="pill ' + stt + '">' + (stt === 'out' ? 'Rupture' : stt === 'low' ? 'Stock bas' : 'OK') + '</span></td>' +

    '<td class="num">' + (m.delta > 0 ? '+' : '') + qf(m.delta) + ' ' + esc(m.unit) + '</td><td class="num">' + qf(m.after) + ' ' + esc(m.unit) + '</td><td class="muted">' + esc([m.ref, m.note].filter(Boolean).join(' · ')) + '</td></tr>').join('');

  return vh('Stock', S.stock.length + ' articles suivis', dlBtn + impBtn + '<button type="button" class="btn" data-act="stk-shop">Liste de réapprovisionnement</button><button type="button" class="btn btn-primary" data-act="stk-new">' + ic('plus') + 'Nouvel article</button>') +
    '<p class="muted small" style="margin:-14px 0 16px">Importer un CSV pour remplir ou mettre à jour le stock en masse : reprenez le fichier exporté, un article existant (même nom) est mis à jour, un nom inconnu crée un nouvel article.</p>' +
    '<div class="kpis"><div class="kpi"><div class="kpi-l">Articles</div><div class="kpi-v">' + S.stock.length + '</div></div><div class="kpi"><div class="kpi-l">Valeur du stock</div><div class="kpi-v">' + money(val) + '</div></div>' +
    '<div class="kpi' + (low ? ' warn' : '') + '"><div class="kpi-l">Stock bas</div><div class="kpi-v">' + low + '</div></div><div class="kpi' + (out ? ' bad' : '') + '"><div class="kpi-l">Ruptures</div><div class="kpi-v">' + out + '</div></div></div>' +

      : (moves ? '<div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Article</th><th>Type</th><th class="num">Variation</th><th class="num">Stock après</th><th>Détail</th></tr></thead><tbody>' + moves + '</tbody></table></div><p class="muted small" style="margin-top:10px">Les 80 derniers mouvements sont affichés.</p>' : '<p class="empty card">Aucun mouvement pour l\'instant. Les ventes, réceptions et pertes apparaîtront ici.</p>'));

/* ---------- Ventes ---------- */
function viewVentes() {
  const u = S.ui, t0 = startOfDay();

  const paid = paidBetween(from, Infinity), st = stats(paid);
  const shown = u.vstat === 'payee' ? paid.slice().sort((a, b) => b.paidAt - a.paidAt) : S.orders.filter(o => o.status === 'annulee' && o.createdAt >= from).sort((a, b) => b.createdAt - a.createdAt);
  const pk = (st.byKind.boisson || 0) + (st.byKind.plat || 0), pb = pk ? st.byKind.boisson / pk * 100 : 0;
  const rows = shown.slice(0, 200).map(o => '<tr class="click" data-act="ord-view" data-id="' + o.id + '" tabindex="0"><td class="tnum">N°' + o.n + '</td><td class="tnum">' + esc(dfDT.format(new Date(o.paidAt || o.createdAt))) + '</td><td>' + esc(orderLabel(o)) + '</td>' +
    '<td class="ellip">' + esc(o.items.map(l => l.qty + '× ' + l.name).join(', ')) + '</td><td>' + (o.status === 'payee' ? esc(PAYS[o.pay] || '') : pillSt(o.status)) + '</td><td class="num"><b>' + money(o.total) + '</b></td></tr>').join('');

  return vh('Ventes', 'Historique des commandes encaissées', dlBtn) +
    '<div class="toolbar"><div class="chips">' + [['today', "Aujourd'hui"], ['7', '7 jours'], ['30', '30 jours'], ['all', 'Tout']].map(p => chip('period', p[0], p[1], u.period === p[0])).join('') + '</div></div>' +
    '<div class="kpis"><div class="kpi"><div class="kpi-l">Chiffre d\'affaires TTC</div><div class="kpi-v">' + money(st.ttc) + '</div></div><div class="kpi"><div class="kpi-l">Hors taxes</div><div class="kpi-v">' + money(st.ht) + '</div></div>' +
    '<div class="kpi"><div class="kpi-l">TVA collectée</div><div class="kpi-v">' + money(st.tva) + '</div></div><div class="kpi"><div class="kpi-l">Commandes</div><div class="kpi-v">' + st.n + '</div></div>' +

    '<div class="grid2" style="margin-bottom:16px"><section class="card"><h2>Boissons et plats</h2>' + (pk ? '<div class="split"><i style="width:' + pb + '%;background:var(--drink)"></i><i style="width:' + (100 - pb) + '%;background:var(--food)"></i></div><div class="legend"><span><span class="sw" style="background:var(--drink)"></span>Boissons ' + money(st.byKind.boisson || 0) + '</span><span><span class="sw" style="background:var(--food)"></span>Plats ' + money(st.byKind.plat || 0) + '</span></div>' : '<p class="empty">Aucune vente sur la période.</p>') +
    '<div class="hr"></div><h3>Moyens de paiement</h3><div class="list" style="margin-top:6px">' + (Object.keys(st.byPay).length ? Object.keys(st.byPay).map(k => '<div class="li"><span>' + esc(PAYS[k] || k) + '</span><b class="tnum">' + money(st.byPay[k]) + '</b></div>').join('') : '<p class="muted small">—</p>') + '</div></section>' +

/* ---------- Factures ---------- */
function tableLabel(i) {
  if (i.kind === 'room') return 'Chambre · ' + (i.roomName || '');
  if (i.kind === 'hall') return 'Salle · ' + (i.hallName || '');
  return i.type === 'sur_place' ? (/^\d+$/.test(i.table) ? 'Table ' + i.table : (i.table || 'Sur place')) : (TYPES[i.type] || '');
}
function viewFactures() {
  const u = S.ui, t0 = startOfDay();
  const from = u.fperiod === 'today' ? t0 : u.fperiod === '7' ? t0 - 6 * DAY : u.fperiod === '30' ? t0 - 29 * DAY : 0;
  const list = S.invoices.filter(i => i.createdAt >= from).sort((a, b) => b.num - a.num);
  const total = list.reduce((a, i) => a + i.ttc, 0), tva = list.reduce((a, i) => a + i.tva, 0);
  const rows = list.slice(0, 300).map(i => '<tr class="click" data-act="fact-view" data-id="' + i.id + '" tabindex="0"><td class="tnum"><b>' + esc(i.numStr) + '</b></td><td class="tnum">' + esc(dfDT.format(new Date(i.createdAt))) + '</td><td>' + esc(tableLabel(i)) + '</td><td>' + (i.customerName ? esc(i.customerName) + (i.pointsEarned != null ? ' · +' + i.pointsEarned + ' pts' : '') : '<span class="muted">—</span>') + '</td><td>' + (i.cashier ? esc(i.cashier) : '<span class="muted">—</span>') + '</td><td>' + esc(PAYS[i.pay] || '') + '</td><td class="num">' + money(i.ht) + '</td><td class="num">' + money(i.tva) + '</td><td class="num"><b>' + money(i.ttc) + '</b></td></tr>').join('');
  const dlBtn = S.dl ? '<button type="button" class="btn" data-act="fact-csv">' + ic('down') + 'Exporter en CSV</button>' : '';
  return vh('Factures', list.length + ' facture' + (list.length > 1 ? 's émises' : ' émise') + ' sur la période', dlBtn) +

/* ---------- Caisse ---------- */
function shiftRow(s, showName) {
  const r = shiftReport(s);

function viewCaisse() {
  const my = currentShift(S.session.userId);

    const r = shiftReport(my);

      '<div class="kpi"><div class="kpi-l">Fond de caisse</div><div class="kpi-v">' + money(Number(my.openingFloat) || 0) + '</div></div></div>' +
      '<div class="hr"></div><h3 style="margin-bottom:8px">Moyens de paiement</h3><div class="list">' + (Object.keys(r.byPay).length ? Object.keys(r.byPay).map(k => '<div class="li"><span>' + esc(PAYS[k] || k) + '</span><b class="tnum">' + money(r.byPay[k]) + '</b></div>').join('') : '<p class="muted small">Aucune vente pour l\'instant.</p>') + '</div>' +
      '<div class="vh-actions" style="margin-top:16px"><button type="button" class="btn" data-act="shift-view" data-id="' + my.id + '">' + ic('printer') + 'Voir / imprimer le rapport</button><button type="button" class="btn btn-danger" data-act="shift-close">' + ic('till') + 'Fermer la caisse</button></div></section>';
  } else {
    html += '<section class="card"><h2>Ouvrir la caisse</h2><p class="muted" style="margin-bottom:12px">Enregistre l\'heure d\'ouverture ; les ventes que vous encaisserez ensuite seront comptées dans votre rapport.</p>' +
      fld('Fond de caisse de départ (facultatif)', '<input class="in" id="shift-float" inputmode="decimal" placeholder="0" autocomplete="off">') +
      '<button type="button" class="btn btn-primary" data-act="shift-open">' + ic('till') + 'Ouvrir la caisse</button></section>';
  }
  const mine = S.shifts.filter(s => s.userId === S.session.userId && s.closedAt).sort((a, b) => b.closedAt - a.closedAt);
  html += '<h2 style="margin:22px 0 12px">Vos sessions précédentes</h2>' + (mine.length ? '<div class="tablewrap"><table class="tbl"><thead><tr><th>Ouverture</th><th>Fermeture</th><th class="num">Ventes</th><th class="num">Total TTC</th><th class="num">Écart</th></tr></thead><tbody>' + mine.map(s => shiftRow(s, false)).join('') + '</tbody></table></div>' : '<p class="empty card">Aucune session terminée pour l\'instant.</p>');
  if (isAdmin) {
    const all = S.shifts.slice().sort((a, b) => b.openedAt - a.openedAt);
    const dlBtn = S.dl ? '<button type="button" class="btn btn-sm" data-act="shifts-csv">' + ic('down') + 'Exporter en CSV</button>' : '';
    html += '<div class="card-h" style="margin:22px 0 12px"><h2 style="margin:0">Toutes les caissières</h2>' + dlBtn + '</div>' +
      (all.length ? '<div class="tablewrap"><table class="tbl"><thead><tr><th>Caissière</th><th>Ouverture</th><th>Fermeture</th><th class="num">Ventes</th><th class="num">Total TTC</th><th class="num">Écart</th></tr></thead><tbody>' + all.map(s => shiftRow(s, true)).join('') + '</tbody></table></div>' : '<p class="empty card">Aucune session enregistrée.</p>');
  }
  return vh('Caisse', "Rapport calibré sur l'ouverture et la fermeture de chaque session") + html;
}

/* ---------- Dépenses ---------- */
const EXPENSE_NATURES = ['Achat marchandises', 'Achat matières premières', 'Salaires', 'Loyer', 'Électricité', 'Eau', 'Transport', 'Entretien & réparations', 'Fournitures', 'Communication / Internet', 'Taxes & impôts', 'Autre'];
const CATEGORIE_LABEL = {fixe: 'Charges fixes', quotidienne: 'Dépenses quotidiennes'};
const expCategorie = x => x.categorie === 'fixe' ? 'fixe' : 'quotidienne';
function attachIcon(att) { return /^image\//.test(att.type) ? 'invoice' : 'file'; }
function attList(exp) {
  if (!exp.attachments || !exp.attachments.length) return '—';
  return exp.attachments.map(a => '<a class="btn btn-sm" href="' + a.url + '" download="' + esc(a.name) + '" style="margin:0 4px 4px 0" title="' + esc(a.name) + '">' + ic('paperclip') + '<span class="ellip" style="max-width:90px">' + esc(a.name) + '</span></a>').join('');
}
function viewDepenses() {
  const u = S.ui, t0 = startOfDay();
  const from = u.dperiod === 'today' ? t0 : u.dperiod === '7' ? t0 - 6 * DAY : u.dperiod === '30' ? t0 - 29 * DAY : 0;
  const q = (u.qdep || '').trim().toLowerCase();
  let base = S.expenses.filter(x => x.createdAt >= from);
  if (q) base = base.filter(x => (x.libelle || '').toLowerCase().includes(q) || (x.nature || '').toLowerCase().includes(q) || (x.executant || '').toLowerCase().includes(q));
  const totalFixe = base.filter(x => expCategorie(x) === 'fixe').reduce((a, x) => a + (num(x.montant) || 0), 0);
  const totalQuot = base.filter(x => expCategorie(x) === 'quotidienne').reduce((a, x) => a + (num(x.montant) || 0), 0);
  const total = totalFixe + totalQuot;
  const list = (u.fdep === 'fixe' || u.fdep === 'quotidienne' ? base.filter(x => expCategorie(x) === u.fdep) : base).slice().sort((a, b) => b.createdAt - a.createdAt);
  const rows = list.map(x => '<tr><td class="tnum">' + (x.date ? esc(frDate(x.date)) : '—') + '</td><td><b>' + esc(x.libelle) + '</b></td><td><span class="pill ' + (expCategorie(x) === 'fixe' ? 'info' : 'boisson') + '">' + CATEGORIE_LABEL[expCategorie(x)] + '</span></td><td>' + esc(x.nature || '—') + '</td><td>' + esc(x.executant || '—') + '</td><td class="num">' + (x.qty !== '' && x.qty != null ? qf(num(x.qty)) : '—') + '</td><td class="num">' + (x.pu !== '' && x.pu != null ? money(num(x.pu)) : '—') + '</td><td class="num"><b>' + money(num(x.montant) || 0) + '</b></td><td class="ellip" title="' + esc(x.observations || '') + '">' + esc(x.observations || '—') + '</td><td>' + attList(x) + '</td>' +
    '<td><div class="acts"><button type="button" class="icon-btn" data-act="expense-edit" data-id="' + x.id + '" aria-label="Modifier ' + esc(x.libelle) + '">' + ic('edit') + '</button><button type="button" class="icon-btn danger" data-act="expense-del" data-id="' + x.id + '" aria-label="Supprimer ' + esc(x.libelle) + '">' + ic('trash') + '</button></div></td></tr>').join('');
  const dlBtn = S.dl ? '<button type="button" class="btn" data-act="expenses-csv">' + ic('down') + 'Exporter en CSV</button>' : '';
  return vh('Dépenses', list.length + ' dépense' + (list.length > 1 ? 's' : '') + ' sur la période', dlBtn + '<button type="button" class="btn btn-primary" data-act="expense-new">' + ic('plus') + 'Nouvelle dépense</button>') +
    '<div class="kpis"><div class="kpi"><div class="kpi-l">Nombre de dépenses</div><div class="kpi-v">' + base.length + '</div></div><div class="kpi"><div class="kpi-l">Charges fixes</div><div class="kpi-v">' + money(totalFixe) + '</div></div><div class="kpi"><div class="kpi-l">Dépenses quotidiennes</div><div class="kpi-v">' + money(totalQuot) + '</div></div><div class="kpi"><div class="kpi-l">Total des dépenses</div><div class="kpi-v">' + money(total) + '</div></div></div>' +
    '<div class="toolbar"><div class="chips">' + [['today', "Aujourd'hui"], ['7', '7 jours'], ['30', '30 jours'], ['tout', 'Tout']].map(p => chip('dperiod', p[0], p[1], u.dperiod === p[0])).join('') + '</div></div>' +
    '<div class="toolbar"><div class="chips">' + [['tout', 'Toutes les catégories'], ['fixe', 'Charges fixes'], ['quotidienne', 'Dépenses quotidiennes']].map(p => chip('fdep', p[0], p[1], (u.fdep || 'tout') === p[0])).join('') + '</div></div>' +
    '<div class="toolbar"><div class="searchbox">' + ic('search') + '<input class="in" type="search" placeholder="Rechercher une dépense" aria-label="Rechercher une dépense" data-bind="q-dep" value="' + esc(u.qdep || '') + '" autocomplete="off"></div></div>' +
    (rows ? '<div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Nature</th><th>Exécutant</th><th class="num">Qté</th><th class="num">P.U.</th><th class="num">Montant</th><th>Observations</th><th>Pièces jointes</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="empty card">Aucune dépense sur cette période.</p>');
}

/* ---------- Journal d'accès ---------- */
function viewJournal() {
  const u = S.ui, t0 = startOfDay();
  const from = u.jperiod === 'today' ? t0 : u.jperiod === '7' ? t0 - 6 * DAY : u.jperiod === '30' ? t0 - 29 * DAY : 0;
  let list = S.accessLog.filter(a => a.t >= from);
  if (u.jtype !== 'tout') list = list.filter(a => a.type === u.jtype);
  if (u.quser !== 'tout') list = list.filter(a => a.userId === u.quser);
  list = list.slice().sort((a, b) => b.t - a.t);
  const users = S.users.slice().sort((a, b) => a.name.localeCompare(b.name));
  const nbConnexions = list.filter(a => a.type === 'connexion').length;
  const nbConsult = list.filter(a => a.type === 'consultation').length;
  const rows = list.slice(0, 400).map(a => '<tr><td class="tnum">' + esc(dfDT.format(new Date(a.t))) + '</td><td><b>' + esc(a.userName || 'Inconnu') + '</b></td><td><span class="pill ' + rolePillClass(a.role) + '">' + (ROLE_LABEL[a.role] || a.role || '—') + '</span></td>' +
    '<td><span class="pill ' + (a.type === 'connexion' ? 'ok' : a.type === 'deconnexion' ? 'low' : 'info') + '">' + (ACCESS_LABEL[a.type] || a.type) + '</span></td><td>' + esc(a.detail || '—') + '</td></tr>').join('');
  const dlBtn = S.dl ? '<button type="button" class="btn" data-act="journal-csv">' + ic('down') + 'Exporter en CSV</button>' : '';
  return vh("Journal d'accès", list.length + ' évènement' + (list.length > 1 ? 's' : '') + ' sur la période', dlBtn) +
    '<div class="toolbar"><div class="chips">' + [['today', "Aujourd'hui"], ['7', '7 jours'], ['30', '30 jours'], ['all', 'Tout']].map(p => chip('jperiod', p[0], p[1], u.jperiod === p[0])).join('') + '</div></div>' +
    '<div class="toolbar"><div class="chips">' + [['tout', 'Tous'], ['connexion', 'Connexions'], ['consultation', 'Consultations'], ['deconnexion', 'Déconnexions']].map(p => chip('jtype', p[0], p[1], u.jtype === p[0])).join('') + '</div></div>' +
    '<div class="toolbar"><div class="chips">' + [['tout', 'Tous les comptes']].concat(users.map(x => [x.id, x.name])).map(p => chip('quser', p[0], p[1], u.quser === p[0])).join('') + '</div></div>' +
    '<div class="kpis"><div class="kpi"><div class="kpi-l">Connexions</div><div class="kpi-v">' + nbConnexions + '</div></div><div class="kpi"><div class="kpi-l">Pages consultées</div><div class="kpi-v">' + nbConsult + '</div></div></div>' +
    (rows ? '<div class="tablewrap"><table class="tbl"><thead><tr><th>Date &amp; heure</th><th>Utilisateur</th><th>Rôle</th><th>Évènement</th><th>Détail</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + (list.length > 400 ? '<p class="muted small" style="margin-top:10px">400 évènements affichés sur ' + list.length + '. L\'export CSV contient tout.</p>' : '') : '<p class="empty card">Aucun évènement sur cette période.</p>') +
    '<p class="muted small" style="margin-top:10px">Le journal enregistre les connexions, déconnexions et les pages consultées par chaque compte. Il est conservé jusqu\'à 2000 évènements les plus récents.</p>';
}

/* ---------- Écran de connexion obligatoire (avant toute donnée) ---------- */

  const title = S.boot === 'needs-config' ? 'Connexion à un serveur requise'

  const lead = S.boot === 'needs-config'
    ? 'Ce logiciel n\'enregistre plus aucune donnée dans ce navigateur : les données (commandes, stock, ventes, clients…) doivent être stockées sur un serveur. Configurez une connexion ci-dessous pour commencer.'

    ? 'Impossible de joindre le serveur configuré : « ' + esc(S.bootError || 'raison inconnue') + ' ». Vérifiez l\'adresse et le code d\'accès ci-dessous, puis réessayez.'

    '<div class="estab-row" style="padding:0 0 18px;justify-content:center">' + ic('swap') + '<h1 style="font-size:22px">Comptoir</h1></div>' +

}

function render() {
  const main = $('#main');
  if (S.boot !== 'ready') {
    main.innerHTML = viewServerGate();
    $('#side').innerHTML = '<div class="brand"><span class="mark" aria-hidden="true">C</span><span class="bname">Comptoir</span></div>';
    $('#tabbar').innerHTML = '';
    return;
  }
  const ae = document.activeElement;
  const keep = (ae && ae.id && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && main.contains(ae)) ? {id: ae.id, s: ae.selectionStart, e: ae.selectionEnd} : null;
  const sy = window.scrollY, inner = {};
  main.querySelectorAll('[data-scroll]').forEach(el => { inner[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });
  syncSession();
  if (!S.session.role) S.ui.view = 'login'; else if (!canView(S.ui.view)) S.ui.view = defaultViewFor(S.session.role);
  main.innerHTML = topbarHtml() + VIEWS[S.ui.view]();
  renderSide();
  main.querySelectorAll('[data-scroll]').forEach(el => { const p = inner[el.dataset.scroll]; if (p) { el.scrollTop = p[0]; el.scrollLeft = p[1]; } });
  window.scrollTo(0, sy);
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
  }
}
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}
function applyTheme() {
  let t = 'auto'; try { t = localStorage.getItem('comptoir.theme') || 'auto'; } catch (e) {}
  const r = document.documentElement;
  if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
}

function openModal(type, data) { M = {type, data}; drawModal(); }
function drawModal(keepFocus) {
  const root = $('#modal-root');
  if (!M) { root.innerHTML = ''; return; }
  const ae = document.activeElement;
  const keep = (ae && ae.id && root.contains(ae)) ? {id: ae.id, s: ae.selectionStart, e: ae.selectionEnd} : null;
  root.innerHTML = MODALS[M.type](M.data);
  if (M.type === 'receipt' || M.type === 'shiftreport') setPrintPageSize(S.cfg.paperWidth);
  refreshCalcs();
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
  } else if (!keepFocus) { const f = root.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=hidden]),select,textarea'); if (f) f.focus(); }
}
function closeModal() { M = null; $('#modal-root').innerHTML = ''; }
function confirmBox(title, text, yes, onYes, danger) { openModal('confirm', {title, text, yes, onYes, danger: danger !== false}); }

function refreshCalcs() {
  if (!M) return;
  if (M.type === 'product') {
    const d = M.data, box = $('#pm-calc'); if (!box) return;
    const cost = d.recipe.reduce((a, r) => { const s = stockById(r.stockId), q = num(r.qty); return a + (s && q > 0 ? s.cost * q : 0); }, 0);
    const price = num(d.price), tva = num(d.tva) || 0, ht = price / (1 + tva / 100);
    box.innerHTML = '<span>Coût matière : <b>' + money(cost) + '</b></span>' + (price > 0 && d.recipe.length ? '<span>Marge HT : <b>' + money(ht - cost) + '</b> (' + pct(ht > 0 ? (ht - cost) / ht * 100 : 0) + ' %)</span>' : '<span class="muted">Renseignez le prix pour voir la marge.</span>');
  }
  if (M.type === 'move') {
    const d = M.data, box = $('#mv-calc'), s = stockById(d.sid); if (!box || !s) return;
    const q = num(d.qty); let after = null;
    if (q >= 0) after = d.type === 'reception' ? s.qty + q : d.type === 'perte' ? s.qty - q : q;
    const u = $('#mv-unit'); if (u) u.textContent = s.unit;
    box.innerHTML = after == null ? 'Saisissez une quantité.' : (after < 0 ? '<span style="color:var(--danger)">La perte dépasse le stock disponible (' + qf(s.qty) + ' ' + esc(s.unit) + ').</span>' : 'Stock actuel <b>' + qf(s.qty) + '</b> → après mouvement <b>' + qf(after) + ' ' + esc(s.unit) + '</b>');
  }
}

/* Saisie dans les modales */
function setM(t) {
  if (!M) return;
  const path = t.dataset.m, val = t.type === 'checkbox' ? t.checked : t.value, d = M.data;
  if (path.indexOf('r.') === 0) {
    const p = path.split('.'), row = d.recipe[+p[1]]; if (!row) return;
    row[p[2]] = val;
    if (p[2] === 'stockId') { const u = $('#ru-' + p[1]), s = stockById(val); if (u) u.textContent = s ? s.unit : ''; }
  } else d[path] = val;
  if (M.type === 'move' && (path === 'type' || path === 'sid')) { drawModal(true); return; }
  if (M.type === 'custpick' && path === 'q') { drawModal(true); return; }
  if (M.type === 'pay') {
    if (path === 'method') { drawModal(); return; }
    if (path === 'received') { const o = orderById(d.id), r = num(d.received), c = $('#pay-change'); if (c && o) c.textContent = money(r >= o.total ? r - o.total : 0); }
  }
  if (M.type === 'expense' && (path === 'qty' || path === 'pu') && d.qty !== '' && d.pu !== '' && num(d.qty) >= 0 && num(d.pu) >= 0) {
    d.montant = String(round2(num(d.qty) * num(d.pu))).replace('.', ',');
    drawModal(true); return;
  }
  if ((M.type === 'roomcharge' || M.type === 'hallcharge') && (path === 'checkIn' || path === 'checkOut')) {
    if (!d.checkIn) d.checkIn = isoDate(Date.now());
    if (!d.checkOut || d.checkOut <= d.checkIn) d.checkOut = addDaysIso(d.checkIn, 1);
    const list = M.type === 'roomcharge' ? S.rooms : S.halls;
    const item = list.find(x => x.id === (M.type === 'roomcharge' ? d.roomId : d.hallId));
    const nights = nightsBetween(d.checkIn, d.checkOut);
    if (item) d.amount = String(round2(item.rate * nights)).replace('.', ',');
    drawModal(true); return;
  }
  refreshCalcs();
}

/* Enregistrements depuis les modales */
function submitForm(name) {
  if (name === 'bootstrapadmin') {
    const nm = ($('#boot-name').value || '').trim(); const pin = $('#boot-pin').value || ''; const pin2 = $('#boot-pin2').value || '';
    if (!nm) return loginErr('Indiquez votre nom.');
    if (pin.length < 4) return loginErr('Le code PIN doit contenir au moins 4 caractères.');
    if (pin !== pin2) return loginErr('Les deux codes PIN ne correspondent pas.');
    const u = {id: uid('u'), name: nm, role: 'admin', pinHash: simpleHash(pin), active: true, createdAt: Date.now()};
    S.users.push(u); persistCatalog();
    S.session = {userId: u.id, name: u.name, role: u.role};
    try { sessionStorage.setItem('comptoir.session', u.id); } catch (e) {}
    logAccess('connexion', 'Création du compte administrateur');
    S.ui.view = 'dashboard'; render();
    return toast('Compte administrateur créé. Bienvenue ' + u.name + ' !');
  }
  const d = M && M.data;
  if (name === 'confirm') { const f = d.onYes; closeModal(); if (f) f(); return; }
  if (name === 'pinlogin') {
    const u = userById(d.userId); if (!u) return closeModal();
    if (u.active === false) return mErr('Ce compte est désactivé.');
    if (simpleHash(d.pin) !== u.pinHash) return mErr('Code PIN incorrect.');
    S.session = {userId: u.id, name: u.name, role: u.role};
    try { sessionStorage.setItem('comptoir.session', u.id); } catch (e) {}
    logAccess('connexion', 'Connexion');
    closeModal(); S.ui.view = defaultViewFor(u.role); render();
    return toast('Bienvenue ' + u.name + ' !');
  }
  if (name === 'user') {
    const nm = d.name.trim(); if (!nm) return mErr("Donnez un nom à l'utilisateur.");
    if (!['caissiere', 'cuisine', 'manager', 'admin'].includes(d.role)) return mErr('Choisissez un rôle.');
    let u = d.id && userById(d.id);
    if (u && u.role === 'admin' && d.role !== 'admin' && S.users.filter(x => x.role === 'admin').length <= 1) return mErr("Impossible de retirer le rôle du dernier administrateur.");
    if (!u && (!d.pin || d.pin.length < 4)) return mErr('Le code PIN doit contenir au moins 4 caractères.');
    if (d.pin && d.pin.length < 4) return mErr('Le code PIN doit contenir au moins 4 caractères.');
    if (u) { u.name = nm; u.role = d.role; u.active = !!d.active; if (d.pin) u.pinHash = simpleHash(d.pin); }
    else { u = {id: uid('u'), name: nm, role: d.role, pinHash: simpleHash(d.pin), active: true, createdAt: Date.now()}; S.users.push(u); }
    persistCatalog(); closeModal(); render(); return toast(d.id ? 'Utilisateur mis à jour.' : 'Utilisateur créé.');
  }
  if (name === 'customer') {
    const nm = d.name.trim(); if (!nm) return mErr('Donnez un nom au client.');
    const phone = d.phone.trim();
    const pts = Math.max(0, Math.round(num(d.points)) || 0);
    let c = d.id && customerById(d.id);
    if (c) { c.name = nm; c.phone = phone; c.points = pts; } else { c = {id: uid('cl'), name: nm, phone, points: pts, createdAt: Date.now()}; S.customers.push(c); }
    persistCustomer(c);
    if (d.selectAfterSave) S.draft.customerId = c.id;
    closeModal(); render(); return toast(d.id ? 'Client mis à jour.' : 'Client ajouté.');
  }
  if (name === 'employee') {
    const nm = d.name.trim(); if (!nm) return mErr("Donnez un nom à l'employé.");
    const salaire = d.salaire === '' ? '' : num(d.salaire);
    if (d.salaire !== '' && !(salaire >= 0)) return mErr('Indiquez un salaire valide.');
    if (d.dateCloture && d.dateRecrutement && d.dateCloture < d.dateRecrutement) return mErr('La date de clôture ne peut pas précéder la date de recrutement.');
    let e = d.id && employeeById(d.id);
    const obj = {name: nm, poste: (d.poste || '').trim(), salaire: d.salaire === '' ? '' : round2(salaire), dateRecrutement: d.dateRecrutement || '', contrat: d.contrat || 'cdi', lieu: (d.lieu || '').trim(), horaires: (d.horaires || '').trim(), dateCloture: d.dateCloture || ''};
    if (e) Object.assign(e, obj); else { e = Object.assign({id: uid('emp'), createdAt: Date.now()}, obj); S.employees.push(e); }
    persistEmployee(e);
    closeModal(); render(); return toast(d.id ? 'Employé mis à jour.' : 'Employé ajouté.');
  }
  if (name === 'expense') {
    const lib = d.libelle.trim(); if (!lib) return mErr('Donnez un libellé à la dépense.');
    if (!d.date) return mErr('Indiquez une date.');
    if (!['fixe', 'quotidienne'].includes(d.categorie)) return mErr('Choisissez une catégorie.');
    const qty = d.qty === '' ? '' : num(d.qty);
    if (d.qty !== '' && !(qty >= 0)) return mErr('Indiquez une quantité valide.');
    const pu = d.pu === '' ? '' : num(d.pu);
    if (d.pu !== '' && !(pu >= 0)) return mErr('Indiquez un prix unitaire valide.');
    const montant = num(d.montant);
    if (!(montant >= 0)) return mErr('Indiquez un montant valide.');
    let x = d.id && expenseById(d.id);
    const obj = {date: d.date, categorie: d.categorie, libelle: lib, nature: (d.nature || '').trim(), executant: (d.executant || '').trim(), qty: d.qty === '' ? '' : round3(qty), pu: d.pu === '' ? '' : round2(pu), montant: round2(montant), observations: (d.observations || '').trim(), attachments: d.attachments || []};
    if (x) Object.assign(x, obj); else { x = Object.assign({id: uid('dep'), createdAt: Date.now()}, obj); S.expenses.push(x); }
    persistExpense(x);
    closeModal(); render(); return toast(d.id ? 'Dépense mise à jour.' : 'Dépense ajoutée.');
  }
  if (name === 'roomcharge') {
    const r = S.rooms.find(x => x.id === d.roomId); if (!r) return closeModal();
    if (!d.checkIn) return mErr('Indiquez une date d\'arrivée.');
    let checkOut = d.checkOut; if (!checkOut || checkOut <= d.checkIn) checkOut = addDaysIso(d.checkIn, 1);
    const nights = nightsBetween(d.checkIn, checkOut);
    const amt = num(d.amount); if (!(amt > 0)) return mErr('Indiquez un montant valide.');
    const rp = {id: uid('rp'), roomId: r.id, roomName: r.name, checkIn: d.checkIn, checkOut, nights, client: (d.client || '').trim(), amount: round2(amt), pay: d.method, createdAt: Date.now(), paidBy: S.session.name || '', paidByUserId: S.session.userId || ''};
    S.roomPayments.unshift(rp);
    const rinv = createRoomInvoice(rp);
    if (rinv) rp.invoiceNum = rinv.numStr;
    persistRoomPayment(rp);
    closeModal(); render(); toast(r.name + ' encaissée · ' + money(rp.amount) + (rinv ? ' · Facture ' + rinv.numStr : ''));
    return openModal('roomreceipt', {id: rp.id});
  }
  if (name === 'hallcharge') {
    const h = S.halls.find(x => x.id === d.hallId); if (!h) return closeModal();
    if (!d.checkIn) return mErr('Indiquez une date de début.');
    let checkOut = d.checkOut; if (!checkOut || checkOut <= d.checkIn) checkOut = addDaysIso(d.checkIn, 1);
    const nights = nightsBetween(d.checkIn, checkOut);
    const amt = num(d.amount); if (!(amt > 0)) return mErr('Indiquez un montant valide.');
    const hp = {id: uid('hp'), hallId: h.id, hallName: h.name, checkIn: d.checkIn, checkOut, nights, client: (d.client || '').trim(), amount: round2(amt), pay: d.method, createdAt: Date.now(), paidBy: S.session.name || '', paidByUserId: S.session.userId || ''};
    S.hallPayments.unshift(hp);
    const hinv = createHallInvoice(hp);
    if (hinv) hp.invoiceNum = hinv.numStr;
    persistHallPayment(hp);
    closeModal(); render(); toast(h.name + ' encaissée · ' + money(hp.amount) + (hinv ? ' · Facture ' + hinv.numStr : ''));
    return openModal('hallreceipt', {id: hp.id});
  }
  if (name === 'shiftclose') {
    const counted = d.counted === '' ? null : num(d.counted);
    if (d.counted !== '' && !isFinite(counted)) return mErr('Montant compté invalide.');
    closeShift(d.id, counted, d.note);
    closeModal(); render(); return toast('Caisse fermée.');
  }
  if (name === 'pay') {
    const o = orderById(d.id); if (!o) return closeModal();
    if (d.method === 'especes' && d.received !== '' && num(d.received) < o.total) return mErr('Le montant reçu est inférieur au total.');
    return payOrder(d.id, d.method);
  }
  if (name === 'product') {
    const name2 = d.name.trim(); if (!name2) return mErr('Donnez un nom au produit.');
    const price = num(d.price); if (!(price >= 0)) return mErr('Indiquez un prix valide.');
    const tva = num(d.tva); if (!(tva >= 0 && tva <= 100)) return mErr('La TVA doit être comprise entre 0 et 100.');
    const recipe = d.recipe.filter(r => r.stockId).map(r => ({stockId: r.stockId, qty: num(r.qty)}));
    if (recipe.some(r => !(r.qty > 0))) return mErr('Chaque article de la recette doit avoir une quantité supérieure à 0.');
    const obj = {id: d.id || uid('p'), name: name2, kind: d.kind, cat: d.cat.trim(), price: round2(price), tva, active: !!d.active, img: d.img || '', recipe: recipe};
    const i = S.products.findIndex(p => p.id === obj.id);
    if (i >= 0) S.products[i] = obj; else S.products.push(obj);
    persistCatalog(); closeModal(); render(); return toast('Produit enregistré.');
  }
  if (name === 'stockitem') {
    const nm = d.name.trim(); if (!nm) return mErr("Donnez un nom à l'article.");
    if (!d.unit.trim()) return mErr("Indiquez l'unité (kg, L, pcs…).");
    const qty = num(d.qty), min = num(d.min), cost = num(d.cost);
    if (!(qty >= 0)) return mErr('La quantité doit être un nombre positif ou nul.');
    if (!(min >= 0)) return mErr("Le seuil d'alerte doit être un nombre positif ou nul.");
    if (!(cost >= 0)) return mErr('Le coût unitaire doit être un nombre positif ou nul.');
    let s = d.id && stockById(d.id);
    if (s) {
      const diff = round3(qty - s.qty);
      Object.assign(s, {name: nm, cat: d.cat.trim() || 'Autre', unit: d.unit.trim(), min, cost, supplier: d.supplier.trim()});
      if (diff !== 0) { s.qty = round3(qty); logMove(s, diff, 'inventaire', '', 'Correction manuelle'); persistLog(); }
    } else {
      s = {id: uid('s'), name: nm, cat: d.cat.trim() || 'Autre', unit: d.unit.trim(), qty: round3(qty), min, cost, supplier: d.supplier.trim()};
      S.stock.push(s); if (qty > 0) { logMove(s, qty, 'creation', '', 'Stock initial'); persistLog(); }
    }
    persistCatalog(); closeModal(); render(); return toast('Article enregistré.');
  }
  if (name === 'move') {
    const s = stockById(d.sid); if (!s) return mErr('Choisissez un article.');
    const q = num(d.qty); if (!(q >= 0) || (d.type !== 'inventaire' && q === 0)) return mErr('Saisissez une quantité valide.');
    let delta;
    if (d.type === 'reception') { delta = q; const c = num(d.cost); if (c >= 0 && d.cost !== '') s.cost = c; }
    else if (d.type === 'perte') { if (q > s.qty + 1e-9) return mErr('La perte dépasse le stock disponible.'); delta = -q; }
    else delta = q - s.qty;
    s.qty = Math.max(0, round3(s.qty + delta));
    logMove(s, delta, d.type, '', d.note.trim());
    persistCatalog(); persistLog(); closeModal(); render(); return toast('Stock mis à jour : ' + s.name + ' → ' + qf(s.qty) + ' ' + s.unit);
  }
}

function newProduct() { return {name: '', kind: 'boisson', cat: '', price: '', tva: String(S.cfg.tvaDefault), active: true, img: '', recipe: []}; }
function shopItems() { return S.stock.filter(s => stockStatus(s) !== 'ok').map(s => ({s, need: Math.ceil((s.min * 2 - s.qty) * 100) / 100 || 1})); }

    case 'shop-csv': saveFile('reapprovisionnement-' + fileStamp() + '.csv', csv([['Fournisseur', 'Article', 'En stock', 'Unité', 'À commander', 'Coût estimé']].concat(shopItems().map(i => [i.s.supplier || '', i.s.name, qf(i.s.qty), i.s.unit, qf(i.need), nf2.format(i.need * i.s.cost)])))); break;
