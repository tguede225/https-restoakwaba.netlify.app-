    case 'sales-csv': {
      const from = u.period === 'today' ? startOfDay() : u.period === '7' ? startOfDay() - 6 * DAY : u.period === '30' ? startOfDay() - 29 * DAY : 0;
      const rows = paidBetween(from, Infinity).sort((x, y) => x.paidAt - y.paidAt).map(o => { const s = stats([o]); return [o.n, new Date(o.paidAt).toLocaleDateString('fr-FR'), dfTime.format(new Date(o.paidAt)), TYPES[o.type], orderLabel(o), o.items.map(l => l.qty + '× ' + l.name).join(' | '), nf2.format(o.total), nf2.format(s.ht), nf2.format(s.tva), PAYS[o.pay] || '']; });
      saveFile('ventes-' + fileStamp() + '.csv', csv([['N°', 'Date', 'Heure', 'Type', 'Table / réf.', 'Articles', 'Total TTC', 'HT', 'TVA', 'Paiement']].concat(rows))); break; }
    /* factures */
    case 'fperiod': u.fperiod = v; render(); break;
    case 'jperiod': u.jperiod = v; render(); break;
    case 'jtype': u.jtype = v; render(); break;
    case 'quser': u.quser = v; render(); break;
    case 'femp': u.femp = v; render(); break;
    case 'dperiod': u.dperiod = v; render(); break;
    case 'fdep': u.fdep = v; render(); break;
    case 'rooms-csv': saveFile('chambres-' + fileStamp() + '.csv', csv([['Arrivée', 'Départ', 'Nuits', 'Chambre', 'Client', 'Paiement', 'Montant']].concat(S.roomPayments.slice().sort((a, b) => a.createdAt - b.createdAt).map(rp => { const r = bookingRange(rp); return [frDate(r.checkIn), frDate(r.checkOut), r.nights, rp.roomName, rp.client || '', PAYS[rp.pay] || '', nf2.format(rp.amount)]; })))); break;
    case 'halls-csv': saveFile('salles-' + fileStamp() + '.csv', csv([['Début', 'Fin', 'Jours', 'Salle', 'Client / évènement', 'Paiement', 'Montant']].concat(S.hallPayments.slice().sort((a, b) => a.createdAt - b.createdAt).map(hp => { const r = bookingRange(hp); return [frDate(r.checkIn), frDate(r.checkOut), r.nights, hp.hallName, hp.client || '', PAYS[hp.pay] || '', nf2.format(hp.amount)]; })))); break;
    /* caisse */
    case 'shift-open': { const el = $('#shift-float'); const val = el ? num(el.value) : 0; openShift(S.session.userId, S.session.name, isFinite(val) ? val : 0); render(); toast('Caisse ouverte.'); break; }
    case 'shift-close': { const my = currentShift(S.session.userId); if (my) openModal('shiftclose', {id: my.id, counted: '', note: ''}); break; }
    case 'shift-view': openModal('shiftreport', {id}); break;
    case 'shifts-csv': saveFile('caisse-' + fileStamp() + '.csv', csv([['Caissière', 'Ouverture', 'Fermeture', 'Ventes', 'Total TTC', 'Fond de caisse', 'Espèces attendues', 'Compté', 'Écart']].concat(S.shifts.slice().sort((a, b) => a.openedAt - b.openedAt).map(s => { const r = shiftReport(s); return [s.userName, new Date(s.openedAt).toLocaleString('fr-FR'), s.closedAt ? new Date(s.closedAt).toLocaleString('fr-FR') : 'En cours', r.orders.length + r.rooms.length + r.halls.length, nf2.format(r.grandTotal), nf2.format(Number(s.openingFloat) || 0), nf2.format(r.expectedCash), s.closingCounted != null ? nf2.format(s.closingCounted) : '', r.diff != null ? nf2.format(r.diff) : '']; })))); break;
    case 'fact-view': { const inv = S.invoices.find(x => x.id === id); if (!inv) break; if (inv.kind === 'room') openModal('roomreceipt', {id: inv.roomPaymentId}); else if (inv.kind === 'hall') openModal('hallreceipt', {id: inv.hallPaymentId}); else openModal('order', {id: inv.orderId}); break; }
    case 'fact-csv': saveFile('factures-' + fileStamp() + '.csv', csv([['N° facture', 'Date', 'Heure', 'Table / type', 'Client', 'Points gagnés', 'Caissière', 'Paiement', 'HT', 'TVA', 'TTC', 'N° commande']].concat(S.invoices.slice().sort((a, b) => a.num - b.num).map(i => [i.numStr, new Date(i.createdAt).toLocaleDateString('fr-FR'), dfTime.format(new Date(i.createdAt)), tableLabel(i), i.customerName || '', i.pointsEarned != null ? i.pointsEarned : '', i.cashier || '', PAYS[i.pay] || '', nf2.format(i.ht), nf2.format(i.tva), nf2.format(i.ttc), i.orderN])))); break;
    case 'journal-csv': saveFile('journal-acces-' + fileStamp() + '.csv', csv([['Date', 'Heure', 'Utilisateur', 'Rôle', 'Évènement', 'Détail']].concat(S.accessLog.slice().sort((a, b) => a.t - b.t).map(a => [new Date(a.t).toLocaleDateString('fr-FR'), dfTime.format(new Date(a.t)), a.userName || '', ROLE_LABEL[a.role] || a.role || '', ACCESS_LABEL[a.type] || a.type, a.detail || ''])))); break;
    /* réglages */
    case 'theme': try { localStorage.setItem('comptoir.theme', v); } catch (err) {} applyTheme(); render(); break;
    case 'paperw': S.cfg.paperWidth = v; persistCatalog(); render(); break;
    case 'backup': saveFile('comptoir-sauvegarde-' + fileStamp() + '.json', JSON.stringify({app: 'comptoir', v: 1, date: new Date().toISOString(), cfg: S.cfg, products: S.products, stock: S.stock, orders: S.orders, invoices: S.invoices, customers: S.customers, rooms: S.rooms, roomPayments: S.roomPayments, halls: S.halls, hallPayments: S.hallPayments, employees: S.employees, expenses: S.expenses, users: S.users, shifts: S.shifts, log: S.log, accessLog: S.accessLog}, null, 1)); break;
    case 'fb-save': { const ta = $('#fb-config'); if (!ta) break; const cfg = parseFirebaseConfigPaste(ta.value); if (!cfg) { toast('Configuration Firebase invalide. Collez le bloc complet depuis la console Firebase.'); break; } try { localStorage.setItem(FB_KEY, JSON.stringify(cfg)); } catch (e) {} toast('Configuration enregistrée. Reconnexion…'); setTimeout(() => location.reload(), 900); break; }
    case 'fb-clear': confirmBox('Retirer la configuration Firebase ?', 'Sans serveur configuré, le logiciel ne pourra plus être utilisé tant qu\'une connexion n\'est pas rétablie.', 'Retirer', () => { try { localStorage.removeItem(FB_KEY); } catch (e) {} location.reload(); }); break;
    case 'php-save': { const urlEl = $('#php-url'), codeEl = $('#php-code'); if (!urlEl) break; const url = normalizePrivateServerUrl(urlEl.value); if (!url) { toast('Indiquez l\'adresse de votre serveur PHP.'); break; } try { localStorage.setItem(PHP_KEY, JSON.stringify({url, code: codeEl ? codeEl.value.trim() : ''})); } catch (e) {} toast('Configuration enregistrée. Connexion…'); setTimeout(() => location.reload(), 900); break; }
    case 'php-clear': confirmBox('Retirer la connexion au serveur PHP + MySQL ?', 'Sans serveur configuré, le logiciel ne pourra plus être utilisé tant qu\'une connexion n\'est pas rétablie (sauf autre option déjà configurée).', 'Retirer', () => { try { localStorage.removeItem(PHP_KEY); } catch (e) {} location.reload(); }); break;
    case 'ps-save': { const urlEl = $('#ps-url'), codeEl = $('#ps-code'); if (!urlEl) break; const url = normalizePrivateServerUrl(urlEl.value); if (!url) { toast('Indiquez l\'adresse de votre serveur privé.'); break; } try { localStorage.setItem(PS_KEY, JSON.stringify({url, code: codeEl ? codeEl.value.trim() : ''})); } catch (e) {} toast('Configuration enregistrée. Connexion…'); setTimeout(() => location.reload(), 900); break; }
    case 'ps-clear': confirmBox('Retirer la connexion au serveur privé ?', 'Sans serveur configuré, le logiciel ne pourra plus être utilisé tant qu\'une connexion n\'est pas rétablie (sauf Firebase déjà configuré).', 'Retirer', () => { try { localStorage.removeItem(PS_KEY); } catch (e) {} location.reload(); }); break;
    case 'retry-connect': location.reload(); break;
    case 'reset-demo': confirmBox('Recharger les données d\'exemple ?', 'La carte, le stock, les chambres, les salles et toutes les commandes, factures et clients actuels seront remplacés. Les comptes utilisateurs sont conservés.', 'Remplacer', () => { replaceAll(seedData()); toast('Données d\'exemple chargées.'); }); break;
    case 'reset-empty': confirmBox('Tout effacer ?', 'La carte, le stock, les chambres, les salles, les clients, les employés, les dépenses, les commandes et l\'historique seront supprimés définitivement. Les comptes utilisateurs sont conservés. Pensez à exporter une sauvegarde avant.', 'Tout effacer', () => { const b = seedData(); b.products = []; b.stock = []; b.rooms = []; b.halls = []; b.employees = []; b.expenses = []; replaceAll(b); toast('Toutes les données ont été effacées.'); }); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && M) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.click[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.form; if (f) submitForm(f); });

/* Champs (recherche, ticket, modales, réglages) */
function onField(e) {
  const t = e.target, isChange = e.type === 'change';
  if (t.dataset.m !== undefined) { setM(t); return; }
  const b = t.dataset.bind; if (!b) return;
  const u = S.ui;
  switch (b) {
    case 'q-pos': u.qpos = t.value; render(); break;
    case 'q-carte': u.qcarte = t.value; render(); break;
    case 'q-stock': u.qstock = t.value; render(); break;
    case 'c-stock': u.cstock = t.value; render(); break;
    case 'pos-type': if (t.checked) { S.draft.type = t.value; render(); } break;
    case 'pos-table': S.draft.table = t.value; break;
    case 'pos-ref': S.draft.ref = t.value; break;
    case 'pos-note': S.draft.note = t.value; break;
    case 'cfg-name': if (isChange) { S.cfg.name = t.value.trim() || 'Mon établissement'; persistCatalog(); render(); } break;
    case 'cfg-currency': if (isChange) { S.cfg.currency = t.value.trim() || '€'; persistCatalog(); render(); } break;
    case 'cfg-address': if (isChange) { S.cfg.address = t.value.trim(); persistCatalog(); render(); } break;
    case 'cfg-phone': if (isChange) { S.cfg.phone = t.value.trim(); persistCatalog(); render(); } break;
    case 'cfg-invprefix': if (isChange) { S.cfg.invoicePrefix = t.value.trim(); persistCatalog(); render(); } break;
    case 'cfg-invpad': if (isChange) { const n = Math.round(num(t.value)); S.cfg.invoicePad = (n >= 1 && n <= 10) ? n : (S.cfg.invoicePad || 4); persistCatalog(); render(); } break;
    case 'cfg-tables': if (isChange) { const n = Math.round(num(t.value)); S.cfg.tables = n >= 0 && n <= 200 ? n : S.cfg.tables; persistCatalog(); render(); } break;
    case 'cfg-tva': if (isChange) { const n = num(t.value); S.cfg.tvaDefault = n >= 0 && n <= 100 ? n : S.cfg.tvaDefault; persistCatalog(); render(); } break;
    case 'cfg-points': if (isChange) { const n = Math.max(0, Math.round(num(t.value)) || 0); S.cfg.pointsPerAmount = n; persistCatalog(); render(); } break;
    case 'q-clients': u.qclients = t.value; render(); break;
    case 'q-emp': u.qemp = t.value; render(); break;
    case 'q-dep': u.qdep = t.value; render(); break;
    case 'logo-img': if (isChange && t.files && t.files[0]) {
      const file = t.files[0];
      if (!/^image\//.test(file.type)) { toast('Choisissez un fichier image (JPEG, PNG…).'); break; }
      resizeImageFile(file, 320, 0.85).then(url => { S.cfg.logo = url; persistCatalog(); render(); }).catch(() => toast("Impossible de charger cette image."));
    } break;
    case 'room-name': { const i = +t.dataset.i; if (S.rooms[i] && isChange) { S.rooms[i].name = t.value.trim() || S.rooms[i].name; persistCatalog(); render(); } break; }
    case 'room-rate': { const i = +t.dataset.i; if (S.rooms[i] && isChange) { const n = num(t.value); if (n >= 0) { S.rooms[i].rate = round2(n); persistCatalog(); render(); } } break; }
    case 'hall-name': { const i = +t.dataset.i; if (S.halls[i] && isChange) { S.halls[i].name = t.value.trim() || S.halls[i].name; persistCatalog(); render(); } break; }
    case 'hall-rate': { const i = +t.dataset.i; if (S.halls[i] && isChange) { const n = num(t.value); if (n >= 0) { S.halls[i].rate = round2(n); persistCatalog(); render(); } } break; }
    case 'prod-img': if (isChange && t.files && t.files[0]) {
      const file = t.files[0], modalRef = M;
      if (!/^image\//.test(file.type)) { toast('Choisissez un fichier image (JPEG, PNG…).'); break; }
      resizeImageFile(file, 480, 0.72).then(url => {
        if (M && M === modalRef && M.type === 'product') { M.data.img = url; drawModal(true); }
      }).catch(() => toast("Impossible de charger cette image."));
    } break;
    case 'expense-att': if (isChange && t.files && t.files[0]) {
      const file = t.files[0], modalRef = M;
      const isImg = /^image\/(jpeg|jpg|png)$/.test(file.type), isPdf = file.type === 'application/pdf';
      if (!isImg && !isPdf) { toast('Choisissez une image (JPEG, PNG) ou un PDF.'); t.value = ''; break; }
      if (!(M && M.data.attachments)) M.data.attachments = [];
      if (M.data.attachments.length >= 5) { toast('Maximum 5 pièces jointes par dépense.'); t.value = ''; break; }
      if (isPdf && file.size > 900000) { toast('Ce PDF est trop volumineux (max ≈ 800 Ko).'); t.value = ''; break; }
      const done = url => {
        if (M && M === modalRef && M.type === 'expense') { M.data.attachments = M.data.attachments || []; M.data.attachments.push({name: file.name, type: file.type, url}); drawModal(true); }
      };
      (isImg ? resizeImageFile(file, 1200, 0.75) : readFileAsDataURL(file)).then(done).catch(() => toast('Impossible de charger ce fichier.'));
      t.value = '';
    } break;
    case 'restore': if (isChange && t.files && t.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const d = JSON.parse(fr.result);
          if (!d || !Array.isArray(d.products) || !Array.isArray(d.stock)) throw new Error('format');
          d.orders = Array.isArray(d.orders) ? d.orders : []; d.invoices = Array.isArray(d.invoices) ? d.invoices : []; d.log = Array.isArray(d.log) ? d.log : [];
          d.customers = Array.isArray(d.customers) ? d.customers : []; d.rooms = Array.isArray(d.rooms) ? d.rooms : []; d.roomPayments = Array.isArray(d.roomPayments) ? d.roomPayments : []; d.halls = Array.isArray(d.halls) ? d.halls : []; d.hallPayments = Array.isArray(d.hallPayments) ? d.hallPayments : []; d.employees = Array.isArray(d.employees) ? d.employees : []; d.expenses = Array.isArray(d.expenses) ? d.expenses : []; d.users = Array.isArray(d.users) ? d.users : []; d.shifts = Array.isArray(d.shifts) ? d.shifts : []; d.accessLog = Array.isArray(d.accessLog) ? d.accessLog : [];
          confirmBox('Restaurer cette sauvegarde ?', d.products.length + ' produits, ' + d.stock.length + ' articles et ' + d.orders.length + ' commandes. Les données actuelles seront remplacées.', 'Restaurer', () => { replaceAll(d); toast('Sauvegarde restaurée.'); });
        } catch (err) { toast("Ce fichier n'est pas une sauvegarde Comptoir valide."); }
      };
      fr.readAsText(t.files[0]); t.value = '';
    } break;
    case 'stock-import': if (isChange && t.files && t.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        const res = parseStockCsv(fr.result);
        if (res.error === 'empty') return toast('Le fichier CSV est vide.');
        if (res.error === 'noname') return toast('Colonne « Article » introuvable dans le fichier.');
        if (!res.toCreate.length && !res.toUpdate.length) return toast(res.errors.length ? 'Aucune ligne valide importée (' + res.errors.length + ' erreur(s)).' : 'Aucune donnée à importer.');
        const parts = [];
        if (res.toUpdate.length) parts.push(res.toUpdate.length + ' article' + (res.toUpdate.length > 1 ? 's' : '') + ' mis à jour');
        if (res.toCreate.length) parts.push(res.toCreate.length + ' nouvel' + (res.toCreate.length > 1 ? 's' : '') + ' article' + (res.toCreate.length > 1 ? 's' : '') + ' créé' + (res.toCreate.length > 1 ? 's' : ''));
        let msg = parts.join(' · ') + '.';
        if (res.errors.length) msg += ' ' + res.errors.length + ' ligne(s) ignorée(s) : ' + res.errors.slice(0, 5).join(' ') + (res.errors.length > 5 ? ' …' : '');
        confirmBox('Importer ce fichier CSV ?', msg, 'Importer', () => { applyStockImport(res); render(); toast('Stock mis à jour depuis le CSV.' + (res.errors.length ? ' ' + res.errors.length + ' ligne(s) ignorée(s).' : '')); });
      };
      fr.readAsText(t.files[0]); t.value = '';
    } break;
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* =====================================================================
   Démarrage
   ===================================================================== */
applyTheme();
render();
async function bootSync() {
  if (NATIVE_CLAUDE) { attachDb(); return; }
  const phpCfg = getPhpServerConfig();
  if (phpCfg && phpCfg.url) {
    try { await bootPhpServerSync(); attachDb(); return; }
    catch (e) { console.error('Serveur PHP', e); S.sync = 'local'; S.boot = 'error'; S.bootError = (e && e.message) || 'Connexion impossible'; render(); return; }
  }
  const psCfg = getPrivateServerConfig();
  if (psCfg && psCfg.url) {
    try { await bootPrivateServerSync(); attachDb(); return; }
    catch (e) { console.error('Serveur privé', e); S.sync = 'local'; S.boot = 'error'; S.bootError = (e && e.message) || 'Connexion impossible'; render(); return; }
  }
  const fbCfg = getFirebaseConfig();
  if (fbCfg) {
    try { await bootExternalSync(); attachDb(); return; }
    catch (e) { console.error('Firebase', e); S.sync = 'local'; S.boot = 'error'; S.bootError = (e && e.message) || 'Connexion impossible'; render(); return; }
  }
  /* Aucun serveur configuré : l'écran de connexion obligatoire est déjà affiché (S.boot === 'needs-config'). */
}
bootSync();
setInterval(() => { if (S.ui.view === 'suivi' || S.ui.view === 'dashboard') render(); }, 60000);
})();
</script>
</body>
</html>
